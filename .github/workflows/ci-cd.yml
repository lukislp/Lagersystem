name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  IMAGE: ghcr.io/lukislp/lagersystem

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'LagersystemLVHome.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # SkiaSharp.NativeAssets.Linux (pulled in transitively via LagersystemLVHome.Application)
      # needs these system libraries to load libSkiaSharp.so - same reason the Dockerfile
      # installs them, ubuntu-latest doesn't ship them by default.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 fonts-liberation
      - run: dotnet test LagersystemLVHome.UnitTests/LagersystemLVHome.UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --logger "junit;LogFilePath=TestResults/unit-tests-junit.xml" --collect:"XPlat Code Coverage"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: LagersystemLVHome.UnitTests/TestResults/unit-tests-junit.xml
          retention-days: 7
      # Self-hosted coverage badge (no external service), same pattern as studylife's:
      # merge cobertura via reportgenerator, scoped to the business-logic assemblies
      # (LagersystemLVHome, the Blazor Server UI project, is excluded - no unit-test
      # practice on Razor markup here).
      # reportgenerator is a pinned local tool (.config/dotnet-tools.json) - restored from the NuGet
      # cache instead of installing the latest global tool on every run.
      - run: dotnet tool restore
      # -*.g.cs excludes source-generator output (e.g. the LoggerMessage generator's
      # 700+ lines under obj/) - generated code, same rationale as studylife's
      # migrations exclusion.
      - run: >
          dotnet tool run reportgenerator
          -reports:"LagersystemLVHome.UnitTests/**/TestResults/**/coverage.cobertura.xml"
          -targetdir:coverage-summary
          -reporttypes:JsonSummary
          -assemblyfilters:"-LagersystemLVHome"
          -filefilters:"-*.g.cs"
      - run: python3 scripts/generate_coverage_badge.py coverage-summary/Summary.json coverage-badge.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7
      - name: Hand the coverage badge over for the bot commit
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/badge-handover/files/.github/badges"
          cp coverage-badge.json "$RUNNER_TEMP/badge-handover/files/.github/badges/coverage.json"
          printf '%s\n' .github/badges/coverage.json > "$RUNNER_TEMP/badge-handover/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-handover
          path: ${{ runner.temp }}/badge-handover
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'LagersystemLVHome.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # CA1848 (LoggerMessage delegate suggestion) has no Roslyn code-fix provider, but
      # `dotnet format`'s default run still includes the `analyzers` category and flags
      # every file touched by it as "would be formatted" even though nothing textually
      # changes - a tool-level false positive, not a real formatting violation. Exclude it
      # so --verify-no-changes only fails on genuine whitespace/style issues.
      - run: dotnet format LagersystemLVHome.sln --verify-no-changes --exclude-diagnostics CA1848 --verbosity diagnostic

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'LagersystemLVHome.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore LagersystemLVHome.sln --locked-mode
      # GHSA-2m69-gcr7-jv3q (SQLitePCLRaw.lib.e_sqlite3) is a documented, deliberately accepted risk - see the
      # NuGetAuditSuppress block + comment in Directory.Build.props. No safe fix exists yet: EF Core
      # Sqlite still depends on the vulnerable SQLitePCLRaw 2.1.x line, and an isolated upgrade risks
      # a native-interop mismatch. Tolerated by advisory id, so any other finding against the same
      # package still fails the gate.
      - name: Known-vulnerable NuGet packages (High/Critical fail the build)
        uses: lukislp/ci-workflows/.github/actions/nuget-severity-gate@ea532e9b173cf0e512c9d54c18886eebd0b0d1ab # v1.8.24
        with:
          solution: LagersystemLVHome.sln
          allow-advisories: GHSA-2m69-gcr7-jv3q

  test-db-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lagersystem
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lagersystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagersystem -d lagersystem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Restore-only: this job runs the whole app in the background (`dotnet run` below) and the
      # cache action's post step, which hashes the tree again to save the cache, failed twice on
      # files the running app was writing ("Fail to hash files under directory"). The cache is
      # saved by test-unit/build anyway, so nothing is lost by not saving it here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'LagersystemLVHome.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # SkiaSharp.NativeAssets.Linux needs these to load libSkiaSharp.so - same as the
      # Dockerfile, and this job actually runs the full app via `dotnet run`.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 fonts-liberation
      - name: Set provider connection settings
        run: |
          case "${{ matrix.provider }}" in
            sqlite)
              echo "DatabaseSettings__Provider=SQLite" >> "$GITHUB_ENV"
              echo "DatabaseSettings__ConnectionString=Data Source=inventory-ci.db" >> "$GITHUB_ENV"
              ;;
            postgresql)
              echo "DatabaseSettings__Provider=PostgreSQL" >> "$GITHUB_ENV"
              echo "DatabaseSettings__ConnectionString=Host=localhost;Port=5432;Database=lagersystem;Username=lagersystem;Password=testpass" >> "$GITHUB_ENV"
              ;;
          esac
      # Build separately from starting the app - a cold build of this solution (SkiaSharp/ML.NET
      # native assets, 6 projects) can itself take close to a minute on a shared runner, which
      # left too little of the /healthz wait window for the app to actually start once `dotnet
      # run` did the build inline. Compile time shouldn't compete with the runtime-startup budget.
      - run: dotnet build LagersystemLVHome/LagersystemLVHome.csproj --configuration ${{ env.CONFIGURATION }} -p:TreatWarningsAsErrors=false
      - name: Start app against ${{ matrix.provider }}
        env:
          ASPNETCORE_URLS: http://+:5000
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet run --project LagersystemLVHome/LagersystemLVHome.csproj --configuration ${{ env.CONFIGURATION }} --no-launch-profile --no-build \
            -p:TreatWarningsAsErrors=false > app.log 2>&1 &
          echo $! > app.pid
      # Confirms Database.EnsureCreatedAsync() plus the custom missing-column check (this app's
      # equivalent of a migration step - there is no Migrations/ folder) actually succeed against
      # a real database for every supported provider, not just whichever one was tested by hand.
      - name: Wait for /healthz
        id: healthz
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:5000/healthz > /dev/null; then
              echo "App is healthy against ${{ matrix.provider }}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not become healthy against ${{ matrix.provider }} in time"
          cat app.log
          exit 1
      - if: always()
        name: Stop app
        run: kill "$(cat app.pid)" 2>/dev/null || true
      # outcome (not failure()) so the log gets uploaded whenever the health wait gave up.
      - if: always() && steps.healthz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-log-${{ matrix.provider }}
          path: app.log
          retention-days: 7

  build:
    # No implicit stage-sequencing under GitHub's DAG model (unlike GitLab) - wait for every
    # test job, including all test-db-providers matrix legs, explicitly.
    needs: [test-unit, test-lint, test-security, test-db-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'LagersystemLVHome.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore LagersystemLVHome.sln --locked-mode
      - run: dotnet build LagersystemLVHome.sln --configuration ${{ env.CONFIGURATION }} --no-restore

  # ---------------------------------------------------------------------
  # Version / docker / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    concurrency:
      group: lagersystem-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-26.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). Each
    # leg pushes by digest only; docker-manifest-merge below writes the actual
    # :latest/:$NEXT_VERSION tags. Runs after the release job (not before, see that job) -
    # a build/push failure here never leaves an orphaned, un-tagged GHCR image blocking
    # every future release via the duplicate-tag guard below.
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/Lagersystem/\.github/workflows/ci-cd\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  trivy-scan:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lagersystem-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: lagersystem-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Commits the coverage badge as the lktec-bot App after each release (policy: modules.sync).
  publish-badge:
    needs: [release, test-unit]
    if: needs.release.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/sync.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      artifact: coverage-badge-handover
      branch: main
      version: ${{ needs.release.outputs.version }}
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}